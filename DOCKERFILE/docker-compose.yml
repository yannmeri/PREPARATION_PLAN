services:

  api:
    build: .
    ports:
      - "8000:5000"

    depends_on:
      - db

  db:
    image: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ai_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: